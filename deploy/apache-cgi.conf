# =========================================================================
# BeoFold Mode B: Zero-Daemon Apache CGI (`mod_cgid` / `mod_cgi`)
# Recommended for standard / shared Apache hosts where background daemons are restricted.
# Build static binary: `cargo build --release --target x86_64-unknown-linux-musl -p fold-sync`
# Copy `target/x86_64-unknown-linux-musl/release/fold-sync` -> `/var/www/cgi-bin/fold-sync`
# =========================================================================

SetEnv BEOFOLD_DATA_DIR "/var/lib/beofold"
SetEnv BEOFOLD_QUORUM "1"

# Public Read-Only Browser Observatory (`/beofold/dashboard`) + Cluster Sync API (`/beofold/api/v1`)
ScriptAlias "/beofold/dashboard" "/var/www/cgi-bin/fold-sync"
ScriptAlias "/beofold/api/v1" "/var/www/cgi-bin/fold-sync"
<Directory "/var/www/cgi-bin">
    AllowOverride None
    Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
    Require all granted
    LimitRequestBody 67108864
</Directory>

Alias "/beofold/blobs/" "/var/lib/beofold/blobs/"
<Directory "/var/lib/beofold/blobs/">
    Require all granted
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
