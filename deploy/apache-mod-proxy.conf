# =========================================================================
# BeoFold Mode A: Apache HTTP Server Reverse Proxy (`mod_proxy_http`)
# Recommended for VPS / Dedicated Linux Servers running `fold-sync serve`
# Required Apache modules: `a2enmod proxy proxy_http headers ssl`
# =========================================================================

ProxyRequests Off
ProxyPreserveHost On

# Public Read-Only Browser Observatory & 3D Conformation Viewer (`/beofold/dashboard`)
<Location "/beofold/dashboard">
    ProxyPass "http://127.0.0.1:8780/dashboard" keepalive=On timeout=30
    ProxyPassReverse "http://127.0.0.1:8780/dashboard"
</Location>

# Forward signed cluster API calls + public JSON/PDB conformation endpoints to `fold-sync`
<Location "/beofold/api/v1/">
    ProxyPass "http://127.0.0.1:8780/api/v1/" keepalive=On timeout=60
    ProxyPassReverse "http://127.0.0.1:8780/api/v1/"
    LimitRequestBody 67108864
</Location>

# Offload immutable BLAKE3 content-addressed LZ4 trajectory & topology blobs to Apache sendfile
Alias "/beofold/blobs/" "/var/lib/beofold/blobs/"
<Directory "/var/lib/beofold/blobs/">
    Require all granted
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
