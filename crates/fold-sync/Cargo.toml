[package]
name = "fold-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apache HTTP web synchronizing server (axum mod_proxy daemon + zero-daemon mod_cgid CGI mode) for BeoFold"

[lib]
name = "fold_sync"
path = "src/lib.rs"

[[bin]]
name = "fold-sync"
path = "src/main.rs"

[dependencies]
axum.workspace = true
blake3.workspace = true
clap.workspace = true
fold-physics.workspace = true
fold-proto.workspace = true
fold-storage.workspace = true
tokio.workspace = true
